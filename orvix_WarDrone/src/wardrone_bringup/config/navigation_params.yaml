waypoint_navigator:
  ros__parameters:
    waypoint_acceptance_radius_m: 2.0
    default_altitude_m: 10.0
    default_speed_m_s: 5.0
    mission_file: ""
    # F7: Waypoint re-routing after obstacle avoidance
    enable_rerouting: false
    reroute_offset_m: 20.0

safety_monitor:
  ros__parameters:
    battery_warning_pct: 30.0
    battery_critical_pct: 15.0
    link_timeout_s: 5.0
    telemetry_timeout_s: 3.0
    gps_min_satellites: 6
    action_on_warning: "RTL"
    action_on_critical: "LAND"
    obstacle_emergency_action: "HOLD"

# F9: Wind estimator
wind_estimator:
  ros__parameters:
    wind_filter_window_s: 10.0
    max_safe_wind_m_s: 8.0
    estimation_rate_hz: 2.0
    min_altitude_for_estimation_m: 3.0

# F1: Flight logger (black box)
flight_logger:
  ros__parameters:
    log_dir: "~/wardrone_logs/"
    log_rate_hz: 2.0
    enable_logging: true

# Range sensor -- single sensor config (SITL / minimal hardware)
range_sensor:
  ros__parameters:
    serial_port: "/dev/ttyAMA0"
    baud_rate: 115200
    sensor_sector: "FRONT"
    publish_rate_hz: 10.0
    max_range_m: 12.0
    min_range_m: 0.3
    reading_timeout_s: 0.5
    # Thresholds adjusted to TFmini range (0.3-12m)
    distance_emergency_m: 2.0
    distance_critical_m: 4.0
    distance_warning_m: 8.0
    distance_caution_m: 12.0

# Multi-sensor range configuration (real hardware -- 3x TFmini-S)
# Each sensor covers a different sector.  All publish to /wardrone/obstacles/range;
# the obstacle_merger buffers per-sector so no data is lost.
range_sensor_front:
  ros__parameters:
    serial_port: "/dev/ttyAMA0"
    baud_rate: 115200
    sensor_sector: "FRONT"
    publish_rate_hz: 10.0
    max_range_m: 12.0
    min_range_m: 0.3
    reading_timeout_s: 0.5
    distance_emergency_m: 2.0
    distance_critical_m: 4.0
    distance_warning_m: 8.0
    distance_caution_m: 12.0

range_sensor_left:
  ros__parameters:
    serial_port: "/dev/ttyUSB0"
    baud_rate: 115200
    sensor_sector: "LEFT"
    publish_rate_hz: 10.0
    max_range_m: 12.0
    min_range_m: 0.3
    reading_timeout_s: 0.5
    distance_emergency_m: 2.0
    distance_critical_m: 4.0
    distance_warning_m: 8.0
    distance_caution_m: 12.0

range_sensor_right:
  ros__parameters:
    serial_port: "/dev/ttyUSB1"
    baud_rate: 115200
    sensor_sector: "RIGHT"
    publish_rate_hz: 10.0
    max_range_m: 12.0
    min_range_m: 0.3
    reading_timeout_s: 0.5
    distance_emergency_m: 2.0
    distance_critical_m: 4.0
    distance_warning_m: 8.0
    distance_caution_m: 12.0

# Obstacle merger (fuses vision + range into unified /wardrone/obstacles)
# Per-sector buffering supports any number of range sensors.
obstacle_merger:
  ros__parameters:
    merge_rate_hz: 10.0
    source_max_age_s: 1.0
